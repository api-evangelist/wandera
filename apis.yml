name: Wandera
description: >-
  Wandera was a zero-trust mobile security company (backed by Bessemer Venture
  Partners and Sapphire Ventures) that Jamf acquired in July 2021 for approximately
  $400M. Its technology is now sold as Jamf Security Cloud (RADAR), providing mobile
  threat defense, Zero Trust Network Access (ZTNA), and data policy for mobile and
  desktop fleets. Wandera exposes a REST Risk API on the api.wandera.com host —
  documented on the Jamf Developer portal — that lets security integrations query the
  risk state of enrolled devices and override device risk classifications, using a
  short-lived JWT obtained from an Application ID/Secret pair.
